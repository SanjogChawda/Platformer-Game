<!doctype html>
<html lang="en-us">
  <head>
    <script src="coi-serviceworker.min.js"></script>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>A Ninja's Path — Platformer Game 2026</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --red: #e8003a;
        --red-glow: rgba(232, 0, 58, 0.4);
        --dark: #060608;
        --surface: #0e0e12;
        --border: #1f1f28;
        --text: #c9c9d4;
        --muted: #55556a;
        --font-display: 'Zen Dots', cursive;
        --font-mono: 'Share Tech Mono', monospace;
      }

      html, body {
        background: var(--dark);
        color: var(--text);
        font-family: var(--font-mono);
        min-height: 100vh;
        overflow-x: hidden;
      }

      body::after {
        content: '';
        position: fixed; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        background-size: 150px;
        pointer-events: none;
        z-index: 9998;
        opacity: 0.6;
      }

      /* TOP BAR */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        height: 52px;
        border-bottom: 1px solid var(--border);
        background: rgba(6,6,8,0.97);
        backdrop-filter: blur(8px);
        position: relative;
        z-index: 100;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .katana {
        width: 32px; height: 2px;
        background: var(--red);
        box-shadow: 0 0 10px var(--red-glow);
        position: relative;
        transform: rotate(-35deg);
      }
      .katana::after {
        content: '';
        position: absolute;
        right: -7px; top: -4px;
        width: 9px; height: 9px;
        border-right: 2px solid var(--red);
        border-top: 2px solid var(--red);
        transform: rotate(35deg);
      }

      .topbar-title {
        font-family: var(--font-display);
        font-size: 0.85rem;
        letter-spacing: 0.18em;
        color: #fff;
        text-transform: uppercase;
      }
      .topbar-title span { color: var(--red); text-shadow: 0 0 12px var(--red-glow); }

      .portfolio-link {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border: 1px solid var(--border);
        padding: 6px 16px;
        border-radius: 2px;
        transition: all 0.25s;
        font-family: var(--font-mono);
      }
      .portfolio-link::before { content: '←'; margin-right: 2px; }
      .portfolio-link:hover {
        color: var(--red);
        border-color: var(--red);
        box-shadow: 0 0 14px var(--red-glow);
      }

      /* HERO */
      .hero {
        position: relative;
        text-align: center;
        padding: 56px 40px 44px;
        overflow: hidden;
      }

      .hero::before {
        content: '';
        position: absolute; inset: 0;
        background:
          repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(232,0,58,0.025) 80px, rgba(232,0,58,0.025) 81px),
          repeating-linear-gradient(0deg,  transparent, transparent 80px, rgba(232,0,58,0.025) 80px, rgba(232,0,58,0.025) 81px);
        animation: gridShift 25s linear infinite;
        pointer-events: none;
      }
      @keyframes gridShift {
        from { background-position: 0 0; }
        to   { background-position: 80px 80px; }
      }

      .hero-eyebrow {
        font-size: 0.66rem;
        letter-spacing: 0.35em;
        color: var(--red);
        text-transform: uppercase;
        margin-bottom: 14px;
        animation: fadeUp 0.6s ease both;
      }

      .hero-title {
        font-family: var(--font-display);
        font-size: clamp(2.4rem, 6vw, 4.8rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        color: #fff;
        text-transform: uppercase;
        line-height: 1;
        animation: fadeUp 0.6s 0.1s ease both;
        position: relative;
        display: inline-block;
      }
      .hero-title .red { color: var(--red); text-shadow: 0 0 24px var(--red-glow); }

      .hero-title::before, .hero-title::after {
        content: attr(data-text);
        position: absolute; top: 0; left: 0;
        font-family: var(--font-display);
        font-size: inherit;
        letter-spacing: inherit;
        text-transform: uppercase;
        width: 100%;
      }
      .hero-title::before {
        color: rgba(0,255,255,0.35);
        animation: glitch1 5s infinite;
        clip-path: polygon(0 20%, 100% 20%, 100% 38%, 0 38%);
      }
      .hero-title::after {
        color: rgba(232,0,58,0.35);
        animation: glitch2 5s infinite;
        clip-path: polygon(0 62%, 100% 62%, 100% 80%, 0 80%);
      }
      @keyframes glitch1 {
        0%,88%,100% { transform: translate(0); }
        90% { transform: translate(-4px, 1px); }
        93% { transform: translate(3px, -1px); }
      }
      @keyframes glitch2 {
        0%,88%,100% { transform: translate(0); }
        89% { transform: translate(4px, -1px); }
        92% { transform: translate(-3px, 2px); }
      }

      .hero-sub {
        margin-top: 16px;
        font-size: 0.76rem;
        color: var(--muted);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        animation: fadeUp 0.6s 0.2s ease both;
      }



      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* GAME */
      .game-outer {
        display: flex;
        justify-content: center;
        padding: 0 24px 52px;
        animation: fadeUp 0.6s 0.35s ease both;
      }

      .game-frame {
        position: relative;
        border: 1px solid var(--border);
        background: #000;
      }

      .c { position: absolute; width: 22px; height: 22px; z-index: 10; }
      .c-tl { top:-1px; left:-1px;  border-top:2px solid var(--red); border-left:2px solid var(--red);  box-shadow:-3px -3px 10px var(--red-glow); }
      .c-tr { top:-1px; right:-1px; border-top:2px solid var(--red); border-right:2px solid var(--red); }
      .c-bl { bottom:-1px; left:-1px;  border-bottom:2px solid var(--red); border-left:2px solid var(--red); }
      .c-br { bottom:-1px; right:-1px; border-bottom:2px solid var(--red); border-right:2px solid var(--red); box-shadow:3px 3px 10px var(--red-glow); }

      .scanlines {
        position: absolute; inset: 0;
        background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.055) 2px, rgba(0,0,0,0.055) 4px);
        pointer-events: none;
        z-index: 5;
      }

      /* FOOTER */
      footer {
        text-align: center;
        padding: 18px 40px 28px;
        border-top: 1px solid var(--border);
        font-size: 0.63rem;
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      footer a { color: var(--red); text-decoration: none; }
      footer a:hover { text-shadow: 0 0 8px var(--red-glow); }
    </style>
  </head>
  <body>

    <header class="topbar">
      <div class="topbar-left">
        <div class="katana"></div>
        <span class="topbar-title">A Ninja<span>'</span>s Path</span>
      </div>
      <a class="portfolio-link" href="https://sanjogchawda.github.io/PortfolioWebsite/" target="_blank">Portfolio</a>
    </header>

    <section class="hero">
      <div class="hero-eyebrow">// Platformer Game 2026</div>
      <h1 class="hero-title" data-text="A NINJA'S PATH">A NINJA<span class="red">'</span>S PATH</h1>
      <p class="hero-sub">Master the shadows &nbsp;·&nbsp; Conquer every platform</p>

    </section>

    <div class="game-outer">
      <div class="game-frame">
        <div class="c c-tl"></div>
        <div class="c c-tr"></div>
        <div class="c c-bl"></div>
        <div class="c c-br"></div>
        <div class="scanlines"></div>

        <div id="unity-container" class="unity-desktop">
          <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
          <div id="unity-warning"></div>
          <div id="unity-footer">
            <div id="unity-logo-title-footer"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">Platformer Game 2026</div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      Built by <a href="https://sanjogchawda.github.io/PortfolioWebsite/" target="_blank">Sanjog Chawda</a>
      &nbsp;·&nbsp; Made with Unity &nbsp;·&nbsp; 2026
    </footer>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Game.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Game.data",
        frameworkUrl: buildUrl + "/Game.framework.js",
        codeUrl: buildUrl + "/Game.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Platformer Game 2026",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        })
          .then((unityInstance) => {
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          })
          .catch((message) => {
            alert(message);
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
