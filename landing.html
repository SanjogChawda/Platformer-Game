<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>A Ninja's Path — Platformer Game 2026</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --red: #e8003a;
        --red-glow: rgba(232, 0, 58, 0.4);
        --dark: #060608;
        --surface: #0e0e12;
        --border: #1f1f28;
        --text: #c9c9d4;
        --muted: #55556a;
        --font-display: 'Zen Dots', cursive;
        --font-mono: 'Share Tech Mono', monospace;
      }

      html, body {
        background: var(--dark);
        color: var(--text);
        font-family: var(--font-mono);
        min-height: 100vh;
        overflow-x: hidden;
      }

      body::after {
        content: '';
        position: fixed; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        background-size: 150px;
        pointer-events: none;
        z-index: 9998;
        opacity: 0.6;
      }

      /* TOP BAR */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        height: 52px;
        border-bottom: 1px solid var(--border);
        background: rgba(6,6,8,0.97);
        backdrop-filter: blur(8px);
        position: relative;
        z-index: 100;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .katana {
        width: 32px; height: 2px;
        background: var(--red);
        box-shadow: 0 0 10px var(--red-glow);
        position: relative;
        transform: rotate(-35deg);
      }
      .katana::after {
        content: '';
        position: absolute;
        right: -7px; top: -4px;
        width: 9px; height: 9px;
        border-right: 2px solid var(--red);
        border-top: 2px solid var(--red);
        transform: rotate(35deg);
      }

      .topbar-title {
        font-family: var(--font-display);
        font-size: 0.85rem;
        letter-spacing: 0.18em;
        color: #fff;
        text-transform: uppercase;
      }
      .topbar-title span { color: var(--red); text-shadow: 0 0 12px var(--red-glow); }

      .portfolio-link {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border: 1px solid var(--border);
        padding: 6px 16px;
        border-radius: 2px;
        transition: all 0.25s;
        font-family: var(--font-mono);
      }
      .portfolio-link::before { content: '←'; margin-right: 2px; }
      .portfolio-link:hover {
        color: var(--red);
        border-color: var(--red);
        box-shadow: 0 0 14px var(--red-glow);
      }

      /* HERO */
      .hero {
        position: relative;
        text-align: center;
        padding: 120px 40px 80px;
        overflow: visible;
        min-height: calc(100vh - 52px - 57px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .hero::before {
        content: '';
        position: absolute; inset: 0;
        background:
          repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(232,0,58,0.025) 80px, rgba(232,0,58,0.025) 81px),
          repeating-linear-gradient(0deg,  transparent, transparent 80px, rgba(232,0,58,0.025) 80px, rgba(232,0,58,0.025) 81px);
        animation: gridShift 25s linear infinite;
        pointer-events: none;
      }
      @keyframes gridShift {
        from { background-position: 0 0; }
        to   { background-position: 80px 80px; }
      }

      .hero-eyebrow {
        font-size: 0.66rem;
        letter-spacing: 0.35em;
        color: var(--red);
        text-transform: uppercase;
        margin-bottom: 14px;
        animation: fadeUp 0.6s ease both;
      }

      .hero-title {
        font-family: var(--font-display);
        font-size: clamp(2.4rem, 6vw, 4.8rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        color: #fff;
        text-transform: uppercase;
        line-height: 1;
        animation: fadeUp 0.6s 0.1s ease both;
        position: relative;
        display: inline-block;
      }
      .hero-title .red { color: var(--red); text-shadow: 0 0 24px var(--red-glow); }

      .hero-title::before, .hero-title::after {
        content: attr(data-text);
        position: absolute; top: 0; left: 0;
        font-family: var(--font-display);
        font-size: inherit;
        letter-spacing: inherit;
        text-transform: uppercase;
        width: 100%;
      }
      .hero-title::before {
        color: rgba(0,255,255,0.35);
        animation: glitch1 5s infinite;
        clip-path: polygon(0 20%, 100% 20%, 100% 38%, 0 38%);
      }
      .hero-title::after {
        color: rgba(232,0,58,0.35);
        animation: glitch2 5s infinite;
        clip-path: polygon(0 62%, 100% 62%, 100% 80%, 0 80%);
      }
      @keyframes glitch1 {
        0%,88%,100% { transform: translate(0); }
        90% { transform: translate(-4px, 1px); }
        93% { transform: translate(3px, -1px); }
      }
      @keyframes glitch2 {
        0%,88%,100% { transform: translate(0); }
        89% { transform: translate(4px, -1px); }
        92% { transform: translate(-3px, 2px); }
      }

      .hero-sub {
        margin-top: 16px;
        font-size: 0.76rem;
        color: var(--muted);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        animation: fadeUp 0.6s 0.2s ease both;
      }

      /* PLAY BUTTON */
      .play-btn {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        margin-top: 52px;
        padding: 16px 44px;
        background: transparent;
        border: 1px solid var(--red);
        color: #fff;
        font-family: var(--font-display);
        font-size: 0.9rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 2px;
        position: relative;
        overflow: hidden;
        transition: color 0.3s, box-shadow 0.3s;
        animation: fadeUp 0.6s 0.35s ease both;
        cursor: pointer;
      }
      .play-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--red);
        transform: translateX(-101%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 0;
      }
      .play-btn:hover::before { transform: translateX(0); }
      .play-btn:hover { box-shadow: 0 0 28px var(--red-glow); }
      .play-btn span { position: relative; z-index: 1; }
      .play-btn .arrow {
        position: relative; z-index: 1;
        width: 0; height: 0;
        border-top: 7px solid transparent;
        border-bottom: 7px solid transparent;
        border-left: 12px solid var(--red);
        transition: border-left-color 0.3s;
        flex-shrink: 0;
      }
      .play-btn:hover .arrow { border-left-color: #fff; }

      /* STATS ROW */
      .stats {
        display: flex;
        gap: 48px;
        margin-top: 64px;
        animation: fadeUp 0.6s 0.5s ease both;
      }
      .stat {
        text-align: center;
      }
      .stat-value {
        font-family: var(--font-display);
        font-size: 1.6rem;
        color: var(--red);
        text-shadow: 0 0 14px var(--red-glow);
        display: block;
      }
      .stat-label {
        font-size: 0.6rem;
        letter-spacing: 0.25em;
        color: var(--muted);
        text-transform: uppercase;
        margin-top: 4px;
        display: block;
      }
      .stat-divider {
        width: 1px;
        background: var(--border);
        align-self: stretch;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* FOOTER */
      footer {
        text-align: center;
        padding: 18px 40px 28px;
        border-top: 1px solid var(--border);
        font-size: 0.63rem;
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      footer a { color: var(--red); text-decoration: none; }
      footer a:hover { text-shadow: 0 0 8px var(--red-glow); }
    </style>
  </head>
  <body>

    <header class="topbar">
      <div class="topbar-left">
        <div class="katana"></div>
        <span class="topbar-title">A Ninja<span>'</span>s Path</span>
      </div>
      <a class="portfolio-link" href="https://sanjogchawda.github.io/PortfolioWebsite/" target="_blank">Portfolio</a>
    </header>

    <section class="hero">
      <div class="hero-eyebrow">// Platformer Game 2026</div>
      <h1 class="hero-title" data-text="A NINJA'S PATH">A NINJA<span class="red">'</span>S PATH</h1>
      <p class="hero-sub">Master the shadows &nbsp;·&nbsp; Conquer every platform</p>

      <a class="play-btn" href="index.html">
        <div class="arrow"></div>
        <span>Play Now</span>
      </a>

      <div class="stats">
        <div class="stat">
          <span class="stat-value">2D</span>
          <span class="stat-label">Platformer</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-value">Unity</span>
          <span class="stat-label">Engine</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-value">2026</span>
          <span class="stat-label">Release</span>
        </div>
      </div>
    </section>

    <footer>
      Built by <a href="https://sanjogchawda.github.io/PortfolioWebsite/" target="_blank">Sanjog Chawda</a>
      &nbsp;·&nbsp; Made with Unity &nbsp;·&nbsp; 2026
    </footer>

  </body>
</html>
